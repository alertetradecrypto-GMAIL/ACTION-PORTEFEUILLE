<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1720"><meta name="mobile-web-app-capable" content="yes">
<title>TRADEREPUBLIC</title>
<link rel="manifest" id="mf">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#0f1720;--card:#18222e;--line:#263342;--tx:#e6edf3;--mut:#8b9bb0;--up:#2ecc71;--dn:#ff5d5d;--acc:#ffffff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif}
header{padding:16px;position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:2}
h1{margin:0;font-size:18px;letter-spacing:2px;color:var(--acc)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}
.k{background:var(--card);border-radius:12px;padding:10px 12px}.k b{display:block;font-size:20px}.k small{color:var(--mut)}
button,label.btn{background:var(--acc);color:#000;border:0;border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer}
button.g{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 0}
.tab{padding:7px 12px;border-radius:20px;background:var(--card);white-space:nowrap;cursor:pointer;border:1px solid var(--line)}
.tab.on{background:var(--acc);color:#000;font-weight:600}
main{padding:12px 16px 40px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--mut);font-weight:500;font-size:12px;cursor:pointer}th:first-child,td:first-child{text-align:left;white-space:normal}
td small{color:var(--mut);display:block;font-size:11px}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut);font-size:12px}
.wrap{overflow-x:auto;border-radius:12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;background:var(--mut)}.dot.live{background:var(--up)}
.empty{text-align:center;padding:50px 10px;color:var(--mut)}
@media(max-width:640px){.hm{display:none}}
</style></head><body>
<header><div class="row"><h1>TRADEREPUBLIC</h1><span class="sp"></span>
<label class="btn">⬆ Importer<input id="f" type="file" multiple accept=".pdf,.csv" hidden></label>
<button class="g" id="rf">⟳</button><button class="g" id="gh" title="GitHub">⚙</button></div>
<div class="kpis" id="kp"></div><div class="mut" id="st" style="margin-top:8px"></div></header>
<div class="tabs" id="tb"></div><main id="mn"></main>
<script>
const BROKER="TR",KEY="pf_"+BROKER;
let S=load(),cur="ALL",sortK="v",live={},fx={EUR:1},timer;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{acc:{},map:{}}}catch(e){return{acc:{},map:{}}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const n=v=>typeof v=="number"?v:parseFloat(String(v).replace(/\s/g,"").replace(",","."));
const eur=v=>v==null||isNaN(v)?"–":v.toLocaleString("fr-FR",{style:"currency",currency:"EUR"});
const pc=v=>v==null||isNaN(v)?"–":(v>0?"+":"")+(v*100).toFixed(2)+" %";
const cl=v=>v>0?"up":v<0?"dn":"";

/* ---------- PARSERS ---------- */
async function parseBD(file){
  const z=await JSZip.loadAsync(file);const xml=await z.file("xl/worksheets/sheet1.xml").async("string");
  const d=new DOMParser().parseFromString(xml,"text/xml");const rows=[...d.getElementsByTagName("row")].map(r=>[...r.getElementsByTagName("c")].map(c=>c.textContent.trim()));
  const h=rows.shift();const ix=k=>h.findIndex(x=>x.startsWith(k));
  const id=(file.name.match(/(\d{8,})/)||[,file.name])[1];
  const pos=rows.filter(r=>r[ix("ISIN")]).map(r=>{const q=n(r[ix("Quantit")]),p=n(r[ix("Cours")]),v=n(r[ix("Valorisation")]);
    return{name:r[ix("Nom")],isin:r[ix("ISIN")],qty:q,price:p,cur:r[ix("Devise")],pru:n(r[ix("PRU")]),val:v,fxf:q*p?v/(q*p):1,chg:n(r[ix("Variation")]),mic:r[ix("MIC")]}});
  const dm=file.name.match(/(\d\d)_(\d\d)_(\d{4})/);
  return{id,date:dm?`${dm[1]}/${dm[2]}/${dm[3]}`:new Date().toLocaleDateString("fr-FR"),pos,cash:null};
}
function parseCSV(t){const rows=[];let r=[],f="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=ch}else if(ch=='"')q=true;else if(ch==','){r.push(f);f=""}else if(ch=='\n'){r.push(f);rows.push(r);r=[];f=""}else if(ch!='\r')f+=ch}
  if(f||r.length){r.push(f);rows.push(r)}const h=rows.shift();return rows.map(x=>Object.fromEntries(h.map((k,i)=>[k,x[i]])))}
async function parseTRcsv(file){const T=parseCSV(await file.text()).filter(r=>r.symbol&&r.shares).sort((a,b)=>a.datetime<b.datetime?-1:1);
  const P={},g=i=>P[i]=P[i]||{q:0,c:0};const ev={};
  T.forEach(r=>{const s=+r.shares,t=r.type;if(t=="BUY"){const x=g(r.symbol);x.q+=s;x.c+=-(+r.amount)-(+r.fee||0)}
    else if(t=="SELL"){const x=g(r.symbol);if(x.q>0){x.c*=Math.max(0,(x.q+s)/x.q);x.q+=s}}
    else if(/SPLIT|MERGER|EXCHANGE|SPIN_OFF/.test(t))(ev[r.datetime]=ev[r.datetime]||[]).push(r)});
  // rejouer les opérations sur titres dans l'ordre
  const B={},g2=i=>B[i]=B[i]||{q:0,c:0};
  const all=T.filter(r=>/^(BUY|SELL)$/.test(r.type)||/SPLIT|MERGER|EXCHANGE|SPIN_OFF/.test(r.type));const done={};
  all.forEach(r=>{const s=+r.shares;if(r.type=="BUY"){const x=g2(r.symbol);x.q+=s;x.c+=-(+r.amount)-(+r.fee||0)}
    else if(r.type=="SELL"){const x=g2(r.symbol);if(x.q>0){x.c*=Math.max(0,(x.q+s)/x.q);x.q+=s}}
    else if(!done[r.datetime]){done[r.datetime]=1;const legs=ev[r.datetime];let cost=0;
      legs.filter(l=>+l.shares<0).forEach(l=>{const x=g2(l.symbol);if(x.q>0){const f=Math.min(1,-l.shares/x.q);cost+=x.c*f;x.c-=x.c*f;x.q+=+l.shares}});
      const ins=legs.filter(l=>+l.shares>0),tq=ins.length;ins.forEach(l=>{const x=g2(l.symbol);x.q+=+l.shares;x.c+=cost/tq})}});
  const out={};Object.entries(B).forEach(([i,x])=>{if(x.q>1e-9&&x.c>0)out[i]=x.c/x.q});S.pru=out;
  Object.values(S.acc).forEach(a=>a.pos.forEach(p=>p.pru=out[p.isin]??null));return null}
async function parseTR(file){if(/\.csv$/i.test(file.name))return parseTRcsv(file);
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let L=[];
  for(let p=1;p<=pdf.numPages;p++){const t=await(await pdf.getPage(p)).getTextContent();const g={};
    t.items.forEach(i=>{if(!i.str.trim())return;const y=Math.round(i.transform[5]/3);(g[y]=g[y]||[]).push(i)});
    Object.keys(g).sort((a,b)=>b-a).forEach(y=>L.push(g[y].sort((a,b)=>a.transform[4]-b.transform[4]).map(i=>i.str.trim()).join("  ")))}
  const pos=[];let sec="CT",cash=0,date="";
  L.forEach((l,i)=>{
    if(/PORTEFEUILLE CRYPTO/.test(l))sec="CR";
    let m=l.match(/^ÉTAT DU PATRIMOINE NET\s*$/);const dd=l.match(/au (\d\d\.\d\d\.\d{4})/);if(dd&&!date)date=dd[1].replace(/\./g,"/");
    m=l.match(/Compte courant\s+([\d\s.,]+)\s*EUR/);if(m)cash=n(m[1].replace(/\./g,""));
    m=l.match(/^([\d.,]+)\s+Pièces\s+(.+?)\s+(Actif|Non négociable)\s+([\d.,]+|-)\s+([\d.,]+|-)/);
    if(m&&sec=="CR")return;
    if(m){let isin="",sym="";for(let j=i+1;j<i+5&&j<L.length;j++){const s=L[j].match(/ISIN:\s*([A-Z0-9]{12})/);if(s){isin=s[1];break}
        if(sec=="CR"&&j==i+1)sym=L[j].split(/\s+/)[0]}
      const q=n(m[1]),p=m[4]=="-"?null:n(m[4].replace(/\.(?=\d{3},)/g,""));
      pos.push({name:m[2],isin:isin||sym,crypto:sec=="CR",qty:q,price:p,cur:"EUR",pru:(S.pru||{})[isin]??null,val:m[5]=="-"?0:n(m[5].replace(/\.(?=\d{3},)/g,"")),fxf:1,chg:null})}
  });
  if(!pos.length)throw"Aucune position trouvée (fichier « État du patrimoine net » attendu)";
  return{id:"TR",date,pos,cash};
}

/* ---------- LIVE QUOTES ---------- */
const PROX=[u=>u,u=>"https://corsproxy.io/?url="+encodeURIComponent(u),u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u)];
let pIdx=+(localStorage.getItem("pidx")||0);
async function gj(u){for(let k=0;k<PROX.length;k++){const i=(pIdx+k)%PROX.length;
  try{const r=await fetch(PROX[i](u),{cache:"no-store"});if(!r.ok)continue;const j=await r.json();if(pIdx!=i){pIdx=i;try{localStorage.setItem("pidx",i)}catch(e){}}return j}catch(e){}}return null}
const SUF={XPAR:".PA",XBRU:".BR",XAMS:".AS",XETR:".DE",XMIL:".MI",XMAD:".MC",XLIS:".LS",XSWX:".SW",XLON:".L"};
async function sym(p){if(S.map[p.isin])return S.map[p.isin];
  const j=await gj("https://query2.finance.yahoo.com/v1/finance/search?quotesCount=10&newsCount=0&q="+p.isin);
  const q=(j&&j.quotes||[]).filter(x=>x.symbol);if(!q.length)return null;
  const want=SUF[p.mic]||(/^(XNYS|XNAS)$/.test(p.mic)?"":null);
  let b=want!=null&&q.find(x=>want?x.symbol.endsWith(want):!x.symbol.includes("."));
  if(!b&&!p.mic)b=q.find(x=>/\.(DE|F)$/.test(x.symbol))&&q.find(x=>!x.symbol.includes("."))||q.find(x=>!x.symbol.includes("."))||q[0];
  b=b||q[0];S.map[p.isin]=b.symbol;save();return b.symbol}
async function yq(s){const j=await gj("https://query1.finance.yahoo.com/v8/finance/chart/"+encodeURIComponent(s)+"?range=1d&interval=5m");
  const m=j&&j.chart&&j.chart.result&&j.chart.result[0]&&j.chart.result[0].meta;if(!m)return null;
  let pr=m.regularMarketPrice,pv=m.chartPreviousClose||m.previousClose,c=m.currency;if(c=="GBp"){pr/=100;pv/=100;c="GBP"}
  return{p:pr,prev:pv,cur:c,t:m.regularMarketTime}}
async function getFx(c){if(fx[c])return fx[c];const q=await yq("EUR"+c+"=X");if(q&&q.p)fx[c]=1/q.p;return fx[c]}
async function refresh(){
  const all=Object.values(S.acc).flatMap(a=>a.pos);st("Mise à jour des cours…");let ok=0;
  const cg=all.filter(p=>p.crypto);
  if(cg.length){const ids={BTC:"bitcoin",ETH:"ethereum",SOL:"solana",XRP:"ripple",ADA:"cardano",DOGE:"dogecoin",DOT:"polkadot",LINK:"chainlink",AVAX:"avalanche-2",LTC:"litecoin",BNB:"binancecoin",MATIC:"matic-network",UNI:"uniswap"};
    try{const r=await(await fetch("https://api.coingecko.com/api/v3/simple/price?vs_currencies=eur&include_24hr_change=true&ids="+Object.values(ids).join(","))).json();
      cg.forEach(p=>{const x=r[ids[p.isin]];if(x){live[p.isin]={eur:x.eur,chg:x.eur_24h_change/100};ok++}})}catch(e){}}
  await Promise.all(all.filter(p=>!p.crypto&&p.isin).map(async p=>{try{const s=await sym(p);if(!s)return;const q=await yq(s);if(!q||!q.p)return;
    const f=await getFx(q.cur);if(!f)return;live[p.isin]={eur:q.p*f,chg:q.prev?q.p/q.prev-1:null,s,t:q.t};ok++}catch(e){}}));
  st(`<span class="dot ${ok?"live":""}"></span>${ok}/${all.length} cours en direct · ${new Date().toLocaleTimeString("fr-FR")}`+(ok<all.length?" · les autres au cours du fichier":""));render()}
function st(h){document.getElementById("st").innerHTML=h}

/* ---------- UI ---------- */
function calc(p){const L=live[p.isin],pe=L?L.eur:(p.price!=null?p.price*p.fxf:null),v=pe!=null?p.qty*pe:p.val,cost=p.pru!=null?p.pru*p.qty:null,
  chg=L&&L.chg!=null?L.chg:p.chg;return{pe,v,cost,pl:cost!=null?v-cost:null,plp:cost?v/cost-1:null,chg,day:chg!=null&&!isNaN(chg)?v-v/(1+chg):0,L}}
function render(){
  const ids=Object.keys(S.acc),tb=document.getElementById("tb"),mn=document.getElementById("mn");
  if(!ids.length){tb.innerHTML="";document.getElementById("kp").innerHTML="";mn.innerHTML=`<div class="empty">Importez le PDF « État du patrimoine net »<br>(app Trade Republic → Profil → Documents / Relevés)<br>+ le CSV des transactions pour les prix d’achat.</div>`;return}
  if(cur!="ALL"&&!S.acc[cur])cur="ALL";
  tb.innerHTML=(ids.length>1?`<div class="tab ${cur=="ALL"?"on":""}" data-a="ALL">Tous</div>`:"")+ids.map(i=>`<div class="tab ${cur==i||ids.length==1?"on":""}" data-a="${i}">${S.acc[i].label||i}</div>`).join("");
  tb.querySelectorAll(".tab").forEach(t=>{t.onclick=()=>{cur=t.dataset.a;render()};t.ondblclick=()=>{const a=S.acc[t.dataset.a];if(!a)return;const l=prompt("Nom du compte (ex. PEA, CTO) :",a.label||"");if(l!=null){a.label=l;save();render()}}});
  const sel=cur=="ALL"||ids.length==1?ids:[cur];let rows=[],cash=0,dates=[];
  sel.forEach(i=>{const a=S.acc[i];cash+=a.cash||0;dates.push(a.date);a.pos.forEach(p=>rows.push({...p,acc:a.label||i,...calc(p)}))});
  const T=rows.reduce((s,r)=>{s.v+=r.v||0;if(r.cost!=null){s.c+=r.cost;s.vc+=r.v}s.d+=r.day||0;return s},{v:0,c:0,vc:0,d:0});
  const k=(t,v,c="")=>`<div class="k"><small>${t}</small><b class="${c}">${v}</b></div>`;
  document.getElementById("kp").innerHTML=k("Valeur titres",eur(T.v))+(cash?k("Espèces",eur(cash))+k("Total",eur(T.v+cash)):"")+
    (T.c?k("+/- latente",eur(T.vc-T.c)+` <small class="${cl(T.vc-T.c)}">${pc(T.vc/T.c-1)}</small>`,cl(T.vc-T.c)):"")+k("Variation du jour",eur(T.d),cl(T.d));
  const S2={v:r=>-(r.v||0),n:r=>r.name,pl:r=>-(r.plp??-9),j:r=>-(r.chg??-9)}[sortK];rows.sort((a,b)=>{const x=S2(a),y=S2(b);return x<y?-1:x>y?1:0});
  const hasPru=rows.some(r=>r.pru!=null);
  mn.innerHTML=`<p class="mut">Fichier(s) du ${[...new Set(dates)].join(", ")} · double-tap sur un onglet pour le renommer · tap sur une ligne pour corriger le symbole</p>
  <div class="wrap"><table><tr><th data-s="n">Titre</th><th class="hm">Qté</th><th>Cours €</th><th data-s="j">Jour</th><th data-s="v">Valeur</th>${hasPru?'<th data-s="pl">+/-</th>':""}<th class="hm">Poids</th></tr>
  ${rows.map(r=>`<tr data-i="${r.isin}"><td>${r.name}<small>${r.L?'<span class="dot live"></span>'+(r.L.s||r.isin):r.isin}${sel.length>1?" · "+r.acc:""}</small></td>
  <td class="hm">${+r.qty.toFixed(6)}</td><td>${r.pe!=null?r.pe.toLocaleString("fr-FR",{maximumFractionDigits:r.pe<10?4:2}):"–"}</td>
  <td class="${cl(r.chg)}">${pc(r.chg)}</td><td>${eur(r.v)}</td>${hasPru?`<td class="${cl(r.pl)}">${r.pl!=null?eur(r.pl)+`<small>${pc(r.plp)}</small>`:"–"}</td>`:""}
  <td class="hm">${T.v?(r.v/T.v*100).toFixed(1)+" %":""}</td></tr>`).join("")}</table></div>
  <p><button class="g" id="clr">Effacer les données</button></p>`;
  mn.querySelectorAll("th[data-s]").forEach(h=>h.onclick=()=>{sortK=h.dataset.s;render()});
  mn.querySelectorAll("tr[data-i]").forEach(t=>t.onclick=()=>{const i=t.dataset.i,s=prompt("Symbole Yahoo Finance pour "+i+" (vide = automatique) :",S.map[i]||"");
    if(s!=null){if(s.trim())S.map[i]=s.trim().toUpperCase();else delete S.map[i];delete live[i];save();refresh()}});
  document.getElementById("clr").onclick=()=>{if(confirm("Effacer tous les comptes importés ?")){S.acc={};save();render()}};
}
async function importFiles(files){for(const f of files){try{const a=await(BROKER=="BD"?parseBD:parseTR)(f);if(!a){st("✔ Prix d’achat calculés depuis "+f.name);continue}
  a.label=(S.acc[a.id]&&S.acc[a.id].label)||(BROKER=="BD"?"Compte …"+a.id.slice(-4):"Trade Republic");S.acc[a.id]=a;st(`✔ ${f.name} importé (${a.pos.length} lignes)`)}catch(x){st("✖ "+f.name+" : "+x)}}
  save();render();refresh()}
document.getElementById("f").onchange=async e=>{await importFiles([...e.target.files]);e.target.value=""};
document.getElementById("rf").onclick=refresh;
document.getElementById("mf").href=URL.createObjectURL(new Blob([JSON.stringify({name:"TRADEREPUBLIC",short_name:"TRADEREPUBLIC",display:"standalone",background_color:"#0f1720",theme_color:"#0f1720",start_url:location.href,icons:[{src:"data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="#ffffff"/><text x="50" y="66" font-size="44" text-anchor="middle" font-family="sans-serif" font-weight="bold">TR</text></svg>'),sizes:"any",type:"image/svg+xml"}]})],{type:"application/json"}));
const GK="gh_cfg";function ghc(){try{return JSON.parse(localStorage.getItem(GK))||{}}catch(e){return{}}}
document.getElementById("gh").onclick=()=>{const c=ghc();const r=prompt("Dépôt privé (pseudo/nom) :",c.repo||"alertetradecrypto-GMAIL/PORTEFEUILLE-DATA");if(r==null)return;
  const t=prompt("Clé d'accès GitHub (laisser vide pour garder l'actuelle) :","");try{localStorage.setItem(GK,JSON.stringify({repo:r.trim(),tok:(t&&t.trim())||c.tok}))}catch(e){}ghSync()};
const bdDate=f=>{const m=f.match(/(\d\d)_(\d\d)_(\d{4})_(\d\d)_(\d\d)/);return m?m[3]+m[2]+m[1]+m[4]+m[5]:f};
async function ghSync(){const c=ghc();if(!c.repo||!c.tok)return false;const H={Authorization:"Bearer "+c.tok};st("Lecture de GitHub…");
  try{const r=await fetch(`https://api.github.com/repos/${c.repo}/contents/TRADEREPUBLIC`,{headers:H,cache:"no-store"});
    if(!r.ok){st("✖ GitHub : "+(r.status==404?"dossier TRADEREPUBLIC ou dépôt introuvable":r.status==401?"clé invalide ou expirée":"erreur "+r.status));return false}
    let L=(await r.json()).filter(x=>x.type=="file");
    if("TRADEREPUBLIC"=="BOURSEDIRECT"){const b={};L.filter(x=>/\.xlsx$/i.test(x.name)).forEach(x=>{const id=(x.name.match(/(\d{8,})/)||[,x.name])[1];if(!b[id]||bdDate(x.name)>bdDate(b[id].name))b[id]=x});L=Object.values(b)}
    else{const last=re=>L.filter(x=>re.test(x.name)).sort((a,b)=>a.name<b.name?1:-1)[0];L=[last(/\.csv$/i),last(/\.pdf$/i)].filter(Boolean)}
    if(!L.length){st("Aucun fichier dans TRADEREPUBLIC/");return false}
    const sig=L.map(x=>x.sha).join();if(sig==S.ghsig){st("GitHub : déjà à jour");refresh();return true}
    const files=await Promise.all(L.map(async x=>new File([await(await fetch(x.url,{headers:{...H,Accept:"application/vnd.github.raw"}})).blob()],x.name)));
    await importFiles(files);S.ghsig=sig;save();return true}catch(e){st("✖ GitHub inaccessible : "+e);return false}}
render();ghSync().then(ok=>{if(!ok&&Object.keys(S.acc).length)refresh()});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)ghSync()});
timer=setInterval(()=>{if(!document.hidden&&Object.keys(S.acc).length)refresh()},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&Object.keys(S.acc).length)refresh()});
</script></body></html>
